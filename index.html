<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz — Laravel</title>
<!-- Bootstrap CSS (CDN) -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  :root{
    --bg:#12151a;
    --panel:#181c22;
    --line:#2a2f38;
    --text:#e6e4dd;
    --muted:#8b93a1;
    --amber:#e8a33d;
    --teal:#3e8e8a;
    --ok:#5fa777;
    --err:#c4574a;
    --mono: "JetBrains Mono","Fira Code",ui-monospace,"SF Mono",Consolas,monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    background:
      radial-gradient(circle at 15% 0%, rgba(62,142,138,.10), transparent 45%),
      radial-gradient(circle at 100% 100%, rgba(232,163,61,.08), transparent 40%),
      var(--bg);
    color:var(--text);
    font-family:var(--mono);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
  }
  .term{
    width:100%;
    max-width:640px;
  }
  .titlebar{
    display:flex;
    align-items:center;
    gap:8px;
    padding:10px 14px;
    background:#1d222a;
    border:1px solid var(--line);
    border-bottom:none;
    border-radius:10px 10px 0 0;
    color:var(--muted);
    font-size:12px;
    letter-spacing:.02em;
  }
  .dot{width:9px;height:9px;border-radius:50%;background:#3a3f48;}
  .titlebar span.path{margin-left:6px;}
  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:0 0 10px 10px;
    padding:28px 26px 24px;
  }
  .prompt{
    color:var(--teal);
    font-size:12px;
    letter-spacing:.06em;
    text-transform:uppercase;
    margin:0 0 4px;
  }
  .prompt b{color:var(--amber);font-weight:600;}
  .quiz-progress{
    display:flex;
    gap:6px;
    margin:14px 0 22px;
  }
  .seg{
    height:4px;
    flex:1;
    background:#262b33;
    border-radius:2px;
    overflow:hidden;
  }
  .seg i{display:block;height:100%;width:0%;background:var(--teal);transition:width .25s ease;}
  .seg.done i{width:100%;background:var(--amber);}
  .seg.current i{width:100%;background:var(--teal);}
  h2.q{
    font-size:17px;
    line-height:1.55;
    font-weight:500;
    margin:0 0 20px;
    color:var(--text);
  }
  h2.q::before{content:"$ ";color:var(--amber);}
  .options{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px;}
  .opt{
    border:1px solid var(--line);
    background:#14181e;
    border-radius:7px;
    padding:12px 14px;
    display:flex;
    gap:12px;
    align-items:flex-start;
    cursor:pointer;
    font-size:14px;
    line-height:1.5;
    transition:border-color .12s ease, background .12s ease, transform .08s ease;
  }
  .opt:hover{border-color:var(--teal);background:#171c23;}
  .opt:active{transform:scale(.997);}
  .opt .k{
    color:var(--muted);
    font-weight:600;
    min-width:1.4em;
  }
  .opt.correct{border-color:var(--ok);background:rgba(95,167,119,.10);}
  .opt.correct .k{color:var(--ok);}
  .opt.wrong{border-color:var(--err);background:rgba(196,87,74,.10);}
  .opt.wrong .k{color:var(--err);}
  .opt.disabled{cursor:default;}
  .opt.dim{opacity:.55;}
  .feedback{
    margin-top:16px;
    padding:12px 14px;
    border-radius:7px;
    font-size:13px;
    line-height:1.6;
    border:1px solid var(--line);
    background:#0f1318;
    display:none;
  }
  .feedback.show{display:block;}
  .feedback .tag{
    font-weight:600;
    margin-right:6px;
  }
  .feedback.ok .tag{color:var(--ok);}
  .feedback.bad .tag{color:var(--err);}
  .footer{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:22px;
  }
  .score{color:var(--muted);font-size:12px;}
  .score b{color:var(--text);}
  button{
    font-family:var(--mono);
    background:transparent;
    border:1px solid var(--line);
    color:var(--muted);
    padding:9px 16px;
    border-radius:7px;
    font-size:13px;
    cursor:pointer;
    transition:.12s ease;
  }
  button.next{
    border-color:var(--amber);
    color:var(--amber);
    visibility:hidden;
  }
  button.next.show{visibility:visible;}
  button.next:hover{background:rgba(232,163,61,.10);}
  button:disabled{opacity:.4;cursor:default;}
  .end{text-align:center;padding:10px 4px 4px;}
  .end .big{font-size:38px;color:var(--amber);margin:6px 0 2px;}
  .end p{color:var(--muted);font-size:13px;margin:4px 0 22px;}
  .end .actions{display:flex;gap:10px;justify-content:center;}
  .cursor{display:inline-block;width:8px;height:15px;background:var(--amber);margin-left:2px;vertical-align:-2px;animation:blink 1s step-end infinite;}
  @keyframes blink{50%{opacity:0;}}
  @media (prefers-reduced-motion: reduce){
    .cursor{animation:none;}
    .opt,.seg i{transition:none;}
  }
</style>
<!-- Mobile responsive tweaks -->
<style>
  @media (max-width: 600px){
    body{padding:18px 10px;}
    .term{max-width:100%;}
    .panel{padding:16px;}
    .titlebar{padding:8px 10px;font-size:11px;}
    .prompt{font-size:11px}
    h2.q{font-size:15px}
    .opt{padding:10px; font-size:14px}
    .quiz-progress{margin:10px 0}
    .seg{height:3px}
    .footer{flex-direction:column;align-items:flex-start;gap:10px}
    .footer .score{font-size:13px}
    button{width:100%}
    .end .big{font-size:34px}
  }
</style>
</head>
<body>

<div class="term container p-0">
  <div class="titlebar">
    <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    <span class="path">dev@laravel:~/quiz</span>
  </div>
  <div class="panel">
    <p class="prompt">Tópico: <b id="topic">—</b></p>
    <div class="quiz-progress" id="progress"></div>

    <div id="quizArea"></div>

    <div class="footer" id="footer" style="display:none;">
      <div class="score">Acertos: <b id="scoreVal">0</b>/<span id="scoreTotal">0</span></div>
      <button class="next btn btn-outline-warning" id="nextBtn">próxima →</button>
    </div>
  </div>
</div>

<script>
const DATA = [
  {
    "topic": "Framework",
    "question": "Uma equipe adota Laravel para evitar repetir a estrutura de rotas, validação e acesso a dados em cada projeto. Essa decisão descreve melhor o uso de um framework como:",
    "options": {
      "A": "Uma linguagem que substitui PHP e JavaScript", 
      "B": "Um banco de dados com tabelas pré-criadas", 
      "C": "Um editor de código com comandos Artisan", 
      "D": "Uma estrutura com ferramentas, convenções e recursos reutilizáveis"
    },
    "answer": "D",
    "explain": "Um framework fornece uma base organizada, convenções e recursos para problemas recorrentes. Ele não substitui a linguagem PHP nem é, por si só, um banco de dados ou editor."
  },
  {
    "topic": "Rotas nomeadas",
    "question": "Considere `Route::get('/alunos', [AlunoController::class, 'index'])->name('alunos.index');`. Se a URL mudar para `/estudantes`, qual uso continua evitando alterações nos links que chamam essa rota?",
    "options": {
      "A": "Usar `url('/alunos.index')`", 
      "B": "Usar `view('alunos.index')`", 
      "C": "Usar `redirect('/alunos')`", 
      "D": "Usar `route('alunos.index')`"
    },
    "answer": "D",
    "explain": "A função `route()` gera a URL a partir do nome da rota, portanto não depende do caminho literal. `view()` resolve uma view, e as outras opções ainda acoplam o código a uma string de URL."
  },
  {
    "topic": "Operador ::",
    "question": "No trecho `[AlunoController::class, 'index']`, qual é o significado específico de `AlunoController::class`?",
    "options": {
      "A": "Cria uma instância de `AlunoController`", 
      "B": "Executa imediatamente o método `index`", 
      "C": "Retorna o nome qualificado da classe `AlunoController`", 
      "D": "Declara uma classe estática chamada `index`"
    },
    "answer": "C",
    "explain": "A constante mágica `::class` fornece o nome qualificado da classe sem instanciá-la. A rota usa esse nome para identificar o Controller e o método que deverá ser chamado."
  },
  {
    "topic": "Operador ::",
    "question": "Qual descrição diferencia corretamente os dois usos de `::` em `Route::get('/', [AlunoController::class, 'index'])`?",
    "options": {
      "A": "Nos dois casos, `::` instancia uma classe", 
      "B": "Em `Route::get` acessa-se método estático; em `AlunoController::class` obtém-se o nome da classe", 
      "C": "Em `Route::get` cria-se uma rota nomeada; em `::class` cria-se um Controller", 
      "D": "Nos dois casos, `::` acessa atributos de um objeto já instanciado"
    },
    "answer": "B",
    "explain": "`Route::get` usa resolução de escopo para chamar um método estático da facade. Já `AlunoController::class` acessa a constante que representa o nome da classe, sem criar objeto."
  },
  {
    "topic": "MVC",
    "question": "Qual fluxo representa melhor uma listagem de alunos em uma aplicação Laravel MVC?",
    "options": {
      "A": "View recebe a URL, consulta o banco e chama o Controller", 
      "B": "Model recebe a URL, monta HTML e retorna a rota", 
      "C": "Rota chama o Controller, que consulta o Model e retorna uma View", 
      "D": "Migration recebe a URL, chama a View e persiste o Controller"
    },
    "answer": "C",
    "explain": "A rota direciona a requisição; o Controller coordena a ação, usa o Model quando precisa de dados e retorna uma resposta, frequentemente uma View. A View não deve concentrar a consulta e o controle do fluxo."
  },
  {
    "topic": "MVC",
    "question": "Um método de Controller recebe dados validados, cria um registro `Aluno` e redireciona com uma mensagem. Qual responsabilidade está mais claramente preservada?",
    "options": {
      "A": "O Controller coordena a requisição; o Model representa a persistência; a View fica para apresentação", 
      "B": "O Controller passa a ser o banco de dados; o Model substitui a View", 
      "C": "A View deve executar a inserção porque conhece os campos do formulário", 
      "D": "A Migration deve redirecionar para exibir a mensagem"
    },
    "answer": "A",
    "explain": "Esse fluxo mantém a separação MVC: o Controller orquestra, o Model lida com dados e a View apresenta conteúdo. Migrations versionam a estrutura do banco, não processam requisições."
  },
  {
    "topic": "Blade",
    "question": "Um layout contém `@yield('conteudo')` e uma view filha contém `@section('conteudo') ... @endsection`. Qual alteração quebra o preenchimento desse ponto do layout?",
    "options": {
      "A": "Trocar o nome da section para `@section('pagina')` sem alterar o yield", 
      "B": "Usar `@extends('layouts.app')` na view filha", 
      "C": "Manter `@section('conteudo')` e incluir HTML dentro dela", 
      "D": "Definir o `@yield('conteudo')` no arquivo de layout"
    },
    "answer": "A",
    "explain": "O nome da section deve corresponder ao identificador passado para `@yield`. `@extends` é justamente a forma esperada de associar a view filha ao layout."
  },
  {
    "topic": "Blade",
    "question": "Qual afirmação descreve corretamente o papel do Blade em Laravel?",
    "options": {
      "A": "É uma camada de acesso ao banco que substitui o Eloquent", 
      "B": "É um motor de templates para criar views com diretivas e dados dinâmicos", 
      "C": "É o compilador de assets usado pelo npm", 
      "D": "É uma classe de validação para formulários"
    },
    "answer": "B",
    "explain": "Blade é o mecanismo de views do Laravel e fornece diretivas como `@section`, `@yield` e `@csrf`. Eloquent, Vite e FormRequest têm responsabilidades diferentes."
  },
  {
    "topic": "Componentes Blade",
    "question": "Em um componente com `<button {{ $attributes->merge(['class' => 'bg-blue-500 p-2']) }}>{{ $slot }}</button>`, a chamada `<x-botao class=\"mt-4\">Salvar</x-botao>` produz qual resultado conceitual?",
    "options": {
      "A": "A classe padrão é removida e o botão recebe somente `mt-4`", 
      "B": "O texto `Salvar` vira um atributo HTML e `$slot` fica vazio", 
      "C": "As classes padrão e `mt-4` são combinadas, e `Salvar` preenche `$slot`", 
      "D": "`merge()` ignora atributos informados na chamada do componente"
    },
    "answer": "C",
    "explain": "`$attributes->merge()` preserva atributos padrão e incorpora os atributos recebidos, incluindo classes adicionais. O conteúdo entre as tags do componente é disponibilizado em `$slot`."
  },
  {
    "topic": "Componentes Blade",
    "question": "Para que serve principalmente `$slot` no template de um componente Blade anônimo?",
    "options": {
      "A": "Representar apenas atributos HTML como `class` e `type`", 
      "B": "Carregar a rota nomeada do componente", 
      "C": "Executar uma consulta Eloquent antes da renderização", 
      "D": "Representar o conteúdo interno passado entre as tags do componente"
    },
    "answer": "D",
    "explain": "`$slot` recebe o conteúdo interno, como o texto de um botão. Os atributos extras são tratados por `$attributes`, não pelo slot."
  },
  {
    "topic": "Vite e npm",
    "question": "Após instalar dependências front-end, qual comando mantém o Vite em modo de desenvolvimento, recompilando assets quando os arquivos mudam?",
    "options": {
      "A": "`php artisan migrate`", 
      "B": "`composer install`", 
      "C": "`npm run dev`", 
      "D": "`php artisan make:controller`"
    },
    "answer": "C",
    "explain": "`npm run dev` executa o script de desenvolvimento do Vite e acompanha mudanças nos assets. Os demais comandos tratam banco, dependências PHP ou geração de código."
  },
  {
    "topic": "CSS",
    "question": "Qual exemplo é corretamente classificado como CSS interno?",
    "options": {
      "A": "`<p style=\"color: red\">Aviso</p>`", 
      "B": "`<link rel=\"stylesheet\" href=\"app.css\">`", 
      "C": "Uma classe Tailwind usada no atributo `class`", 
      "D": "`<style>p { color: red; }</style>` no próprio documento HTML"
    },
    "answer": "D",
    "explain": "CSS interno é declarado na tag `<style>` do documento. O atributo `style` é inline, e o elemento `link` referencia uma folha externa."
  },
  {
    "topic": "Bootstrap e Tailwind",
    "question": "Uma equipe quer iniciar telas com componentes visuais já prontos; outra quer combinar pequenas classes para controlar cada espaçamento e cor. Qual associação é a mais adequada?",
    "options": {
      "A": "Bootstrap para classes utilitárias e Tailwind para componentes prontos", 
      "B": "Bootstrap para componentes prontos e Tailwind para classes utilitárias", 
      "C": "Ambos são ORMs para manipular tabelas", 
      "D": "Ambos substituem o Vite na compilação de assets"
    },
    "answer": "B",
    "explain": "Bootstrap é conhecido por oferecer componentes e estilos prontos, enquanto Tailwind enfatiza utilitários combináveis. Os dois atuam na estilização, não no acesso ao banco."
  },
  {
    "topic": "CSRF",
    "question": "Um formulário POST para excluir um cadastro retorna erro de proteção de requisição, embora a rota e o método estejam corretos. Qual elemento é indispensável dentro do formulário Blade?",
    "options": {
      "A": "`@yield('csrf')`", 
      "B": "`@section('token')`", 
      "C": "`@vite('csrf')`", 
      "D": "`@csrf`"
    },
    "answer": "D",
    "explain": "`@csrf` gera o campo oculto com o token que o Laravel compara à sessão para mitigar CSRF. Diretivas de layout e carregamento de assets não fornecem esse token."
  },
  {
    "topic": "CSRF",
    "question": "Qual cenário caracteriza corretamente uma proteção CSRF, e não uma validação de campos?",
    "options": {
      "A": "Impedir que `cpf` duplicado seja salvo", 
      "B": "Exigir que `nome` tenha no máximo 255 caracteres", 
      "C": "Confirmar que uma requisição de alteração possui token ligado à sessão do usuário", 
      "D": "Garantir que uma rota possua um nome único"
    },
    "answer": "C",
    "explain": "CSRF verifica a origem legítima de uma requisição que altera estado por meio de um token. Regras como `unique` e `max` validam o conteúdo enviado, não a origem da requisição."
  },
  {
    "topic": "Method spoofing",
    "question": "Uma rota de atualização foi definida com `Route::put(...)`. Qual formulário permite que o Laravel a reconheça sem depender de suporte nativo a PUT pelo HTML?",
    "options": {
      "A": "`<form method=\"PUT\"> @csrf </form>`", 
      "B": "`<form method=\"GET\"> @method('PUT') </form>`", 
      "C": "`<form method=\"POST\"> @yield('PUT') </form>`", 
      "D": "`<form method=\"POST\"> @csrf @method('PUT') </form>"
    },
    "answer": "D",
    "explain": "Formulários HTML usam GET ou POST; `@method('PUT')` adiciona o campo oculto que permite o method spoofing no Laravel. Definir `method=\"PUT\"` diretamente não é a solução esperada."
  },
  {
    "topic": "Sessão flash",
    "question": "Após salvar um aluno, o Controller executa `return redirect()->route('alunos.index')->with('mensagem', 'Registro criado');`. Por que `with` é apropriado nesse caso?",
    "options": {
      "A": "Cria uma coluna permanente chamada `mensagem`", 
      "B": "Transforma a mensagem em uma regra de validação", 
      "C": "Envia a mensagem ao Vite para compilar", 
      "D": "Armazena uma mensagem flash para a próxima requisição após o redirecionamento"
    },
    "answer": "D",
    "explain": "A mensagem flash sobrevive ao redirecionamento e normalmente é exibida uma vez na próxima resposta. Ela não é persistida como registro de banco nem substitui validação."
  },
  {
    "topic": "Request",
    "question": "No método `public function salvar(Request $request)`, qual é a interpretação mais precisa para `$request`?",
    "options": {
      "A": "É um array já validado por padrão", 
      "B": "É a Model que representa a tabela recebida", 
      "C": "É uma View com os dados enviados", 
      "D": "É a requisição HTTP injetada, com entradas do formulário e metadados da chamada"
    },
    "answer": "D",
    "explain": "O objeto `Request` representa a requisição recebida e permite acessar entradas, query string e outros dados HTTP. Ele não garante que os dados já foram validados."
  },
  {
    "topic": "FormRequest",
    "question": "Qual sequência representa a separação de responsabilidades esperada ao usar `AlunoRequest` em um Controller?",
    "options": {
      "A": "O Controller chama `rules()` manualmente e a View executa `validated()`", 
      "B": "A Migration valida os dados antes de o Controller receber a requisição", 
      "C": "O FormRequest autoriza e valida antes da lógica do Controller; o Controller usa os dados aprovados", 
      "D": "O Model substitui o FormRequest e devolve apenas dados validados"
    },
    "answer": "C",
    "explain": "O FormRequest intercepta a requisição para autorização e validação antes do método do Controller seguir. Isso mantém regras de entrada fora da lógica principal da ação."
  },
  {
    "topic": "FormRequest",
    "question": "Qual comando cria a classe `AlunoRequest` no local convencional para requisições de formulário do Laravel?",
    "options": {
      "A": "`php artisan make:controller AlunoRequest`", 
      "B": "`php artisan make:model AlunoRequest`", 
      "C": "`npm run make:request AlunoRequest`", 
      "D": "`php artisan make:request AlunoRequest`"
    },
    "answer": "D",
    "explain": "`php artisan make:request AlunoRequest` gera uma FormRequest, normalmente em `app/Http/Requests`. Os geradores de Controller e Model criam classes com responsabilidades diferentes, e npm não executa comandos Artisan."
  },
  {
    "topic": "FormRequest",
    "question": "Dado `public function salvar(AlunoRequest $request) { $dados = $request->validated(); }`, qual é o tipo e o conteúdo esperado de `$dados`?",
    "options": {
      "A": "Um Model `Aluno` ainda não salvo", 
      "B": "Um array somente com entradas que passaram nas regras de validação", 
      "C": "Uma string JSON com todas as entradas, válidas ou não", 
      "D": "Um booleano que informa se `authorize()` retornou true"
    },
    "answer": "B",
    "explain": "`validated()` retorna um array com os dados aceitos pelas regras do FormRequest. Ele não retorna a Model, a resposta HTTP nem todas as entradas sem filtragem."
  },
  {
    "topic": "FormRequest e 403",
    "question": "Um envio possui `nome` e `cpf` válidos, mas o FormRequest contém `public function authorize(): bool { return false; }`. Qual resultado é esperado antes de `rules()` permitir o processamento?",
    "options": {
      "A": "Sucesso 200, pois as regras estão corretas", 
      "B": "Erro 422, pois `authorize()` valida os campos", 
      "C": "Redirecionamento com mensagem flash de sucesso", 
      "D": "Erro 403, pois a ação não foi autorizada"
    },
    "answer": "D",
    "explain": "`authorize()` controla permissão para executar a ação; retornar `false` resulta em 403 Forbidden. Regras de formato e conteúdo pertencem a `rules()` e geram falhas de validação, não de autorização."
  },
  {
    "topic": "FormRequest e 403",
    "question": "Em um exercício sem regra de permissão específica, qual ajuste permite que um `AlunoRequest` recém-criado processe requisições válidas?",
    "options": {
      "A": "Remover o método `rules()`", 
      "B": "Trocar `validated()` por `all()`", 
      "C": "Adicionar `@method('POST')` ao Controller", 
      "D": "Retornar `true` em `authorize()`"
    },
    "answer": "D",
    "explain": "Quando não há política de autorização no exercício, `authorize()` deve retornar `true` para não bloquear a requisição. Remover regras ou usar todos os dados não resolve a recusa de permissão."
  },
  {
    "topic": "Validação",
    "question": "Na regra `'cpf' => 'required|unique:alunos'`, qual situação passa pela regra `required` mas falha na regra `unique`?",
    "options": {
      "A": "O campo CPF não foi enviado", 
      "B": "O CPF foi enviado, mas já existe na tabela `alunos`", 
      "C": "O CPF foi enviado com mais de 255 caracteres", 
      "D": "A rota do formulário não possui nome"
    },

// ---- estado ----
let order = [];      // ordem embaralhada das perguntas (indices em DATA)
let current = 0;
let score = 0;
let answered = false;

const topicEl = document.getElementById('topic');
const progressEl = document.getElementById('progress');
const quizArea = document.getElementById('quizArea');
const footer = document.getElementById('footer');
const scoreVal = document.getElementById('scoreVal');
const scoreTotal = document.getElementById('scoreTotal');
const nextBtn = document.getElementById('nextBtn');

function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildProgress(){
  progressEl.innerHTML = '';
  order.forEach((_, i) => {
    const seg = document.createElement('div');
    seg.className = 'seg' + (i < current ? ' done' : i === current ? ' current' : '');
    seg.innerHTML = '<i></i>';
    progressEl.appendChild(seg);
  });
}

function startQuiz(){
  order = shuffle(DATA.map((_, i) => i)).slice(0, Math.min(10, DATA.length));
  current = 0;
  score = 0;
  scoreTotal.textContent = order.length;
  footer.style.display = 'flex';
  renderQuestion();
}

function renderQuestion(){
  answered = false;
  nextBtn.classList.remove('show');
  const q = DATA[order[current]];
  topicEl.textContent = q.topic;
  buildProgress();
  scoreVal.textContent = score;
  // embaralha as opcoes a cada renderizacao
  const letters = Object.keys(q.options);
  const shuffledLetters = shuffle(letters);

  quizArea.innerHTML = '';

  const h = document.createElement('h2');
  h.className = 'q';
  h.textContent = q.question;
  quizArea.appendChild(h);

  const ul = document.createElement('ul');
  ul.className = 'options';

  shuffledLetters.forEach((origLetter, idx) => {
    const li = document.createElement('li');
    li.className = 'opt';
    const displayLetter = String.fromCharCode(65 + idx); // A, B, C, D na nova posicao
    li.innerHTML = `<span class="k">${displayLetter}</span><span>${q.options[origLetter]}</span>`;
    li.dataset.orig = origLetter;
    li.addEventListener('click', () => selectOption(li, origLetter, q));
    ul.appendChild(li);
  });

  quizArea.appendChild(ul);

  const fb = document.createElement('div');
  fb.className = 'feedback';
  fb.id = 'feedback';
  quizArea.appendChild(fb);
}

function selectOption(li, origLetter, q){
  if(answered) return;
  answered = true;

  const allOpts = quizArea.querySelectorAll('.opt');
  const isCorrect = origLetter === q.answer;

  allOpts.forEach(opt => {
    opt.classList.add('disabled');
    if(opt.dataset.orig === q.answer){
      opt.classList.add('correct');
    } else if(opt === li && !isCorrect){
      opt.classList.add('wrong');
    } else {
      opt.classList.add('dim');
    }
  });

  if(isCorrect) score++;
  scoreVal.textContent = score;

  const fb = document.getElementById('feedback');
  fb.className = 'feedback show ' + (isCorrect ? 'ok' : 'bad');
  fb.innerHTML = `<span class="tag">${isCorrect ? 'Correto.' : 'Incorreto.'}</span>${q.explain}`;

  nextBtn.classList.add('show');
}

nextBtn.addEventListener('click', () => {
  if(!answered) return;
  current++;
  if(current < order.length){
    renderQuestion();
  } else {
    renderEnd();
  }
});

function renderEnd(){
  footer.style.display = 'none';
  buildProgress();
  document.querySelectorAll('.seg').forEach(s => s.classList.add('done'));
  const pct = Math.round((score / order.length) * 100);
  quizArea.innerHTML = `
    <div class="end">
      <p class="prompt">Quiz finalizado<span class="cursor"></span></p>
      <div class="big">${score}/${order.length}</div>
      <p>${pct}% de acerto</p>
      <div class="actions">
        <button id="restartBtn">reiniciar</button>
      </div>
    </div>
  `;
  document.getElementById('restartBtn').addEventListener('click', startQuiz);
}

startQuiz();
</script>
